<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#09090b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI sales agents that book meetings | Chicago AI Group</title>
    <meta name="description" content="Managed AI follow-up for Chicago service businesses. We qualify leads and book meetings. Live in 2–4 weeks." />

    <!--
      Social crawlers do not run JavaScript, so this static set is what Slack, LinkedIn,
      Facebook and iMessage read for every URL on the site. It carries the homepage
      values as the default; src/usePageMeta.js overwrites them per route for search
      engines and the browser tab. No canonical here on purpose -- index.html is served
      for every path, so a hardcoded one would claim every URL is the homepage.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Chicago AI Group" />
    <meta property="og:title" content="AI sales agents that book meetings | Chicago AI Group" />
    <meta property="og:description" content="Managed AI follow-up for Chicago service businesses. We qualify leads and book meetings. Live in 2–4 weeks." />
    <meta property="og:url" content="https://www.chicagoaigroup.com/" />
    <meta property="og:image" content="https://www.chicagoaigroup.com/og-image.png?v=2" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chicago AI Group — AI that books meetings. Book a strategy call." />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI sales agents that book meetings | Chicago AI Group" />
    <meta name="twitter:description" content="Managed AI follow-up for Chicago service businesses. We qualify leads and book meetings. Live in 2–4 weeks." />
    <meta name="twitter:image" content="https://www.chicagoaigroup.com/og-image.png?v=2" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>

</html>
