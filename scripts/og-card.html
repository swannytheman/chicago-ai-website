<!doctype html>
<!--
  Source for public/og-image.png (the Open Graph / Twitter share card).

  This file IS the artwork. Edit here, then re-render at exactly 1200x630 and
  overwrite public/og-image.png, e.g. with a headless browser:

    npx playwright screenshot --viewport-size=1200,630 \
      scripts/og-card.html public/og-image.png

  After changing the PNG, bump the ?v= cache-bust on og:image and twitter:image
  in src/seo.js and index.html, or scrapers will keep serving the old card.

  Keep type inside the 60px safe zone (this layout uses 72/80px padding) and keep
  the CTA large enough to read where Slack renders the card at ~400px wide.
-->
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#09090b; font-family:'Inter',system-ui,sans-serif; color:#fff;
         display:flex; flex-direction:column; justify-content:space-between; padding:72px 80px; position:relative; overflow:hidden; }
  .glow { position:absolute; width:900px; height:900px; border-radius:50%; right:-320px; top:-380px;
          background:radial-gradient(circle, rgba(16,185,129,0.16) 0%, rgba(16,185,129,0) 68%); }
  .grid { position:absolute; inset:0;
          background-image:linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
                           linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
          background-size:64px 64px; }
  .row { display:flex; align-items:center; gap:18px; position:relative; }
  .word { display:flex; flex-direction:column; line-height:1; }
  .word .a { font-weight:600; letter-spacing:4px; font-size:22px; }
  .word .b { font-weight:500; letter-spacing:7px; font-size:16px; color:#64748b; }
  h1 { position:relative; font-size:86px; font-weight:800; letter-spacing:-2.5px; line-height:1.06; max-width:900px; }
  h1 em { font-style:normal; background:linear-gradient(135deg,#fff 0%,#94a3b8 100%);
          -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .bottom { position:relative; display:flex; align-items:center; justify-content:space-between; gap:40px; }
  .meta { display:flex; align-items:center; gap:12px; font-size:20px; color:#8fa3bf; white-space:nowrap; }
  .dot { width:9px; height:9px; border-radius:50%; background:#34d399; }
  .sep { color:#3f3f46; }
  /* Site's primary button: solid white pill, dark label. Sized to stay legible
     when the card is scaled down to roughly a third for an inline unfurl. */
  .cta { background:#fff; color:#09090b; font-size:34px; font-weight:700; letter-spacing:-0.4px;
         padding:22px 44px; border-radius:999px; white-space:nowrap;
         box-shadow:0 0 0 1px rgba(255,255,255,0.08), 0 18px 50px rgba(0,0,0,0.45); }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="grid"></div>

  <div class="row">
    <svg width="56" height="56" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M70 15 A42 42 0 1 0 70 85" stroke="url(#g)" stroke-width="6" stroke-linecap="round" fill="none"/>
      <line x1="30" y1="35" x2="50" y2="50" stroke="#64748b" stroke-width="2"/>
      <line x1="30" y1="65" x2="50" y2="50" stroke="#64748b" stroke-width="2"/>
      <line x1="30" y1="35" x2="30" y2="65" stroke="#64748b" stroke-width="2"/>
      <line x1="50" y1="50" x2="68" y2="50" stroke="#64748b" stroke-width="2"/>
      <circle cx="30" cy="35" r="5" fill="#e2e8f0"/><circle cx="30" cy="65" r="5" fill="#e2e8f0"/>
      <circle cx="68" cy="50" r="4" fill="#e2e8f0"/>
      <circle cx="50" cy="50" r="10" fill="#10b981"/><circle cx="50" cy="50" r="6" fill="#34d399"/>
      <polygon points="82,38 84,42 88,42 85,45 86,49 82,46 78,49 79,45 76,42 80,42" fill="#34d399"/>
      <defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#94a3b8"/>
      </linearGradient></defs>
    </svg>
    <div class="word"><span class="a">CHICAGO AI</span><span class="b">GROUP</span></div>
  </div>

  <h1>AI that books<br><em>meetings.</em></h1>

  <div class="bottom">
    <div class="meta">
      <span class="dot"></span><span>Chicago, IL</span>
      <span class="sep">•</span><span>Built, trained, and run for you</span>
    </div>
    <div class="cta">Book a strategy call &rarr;</div>
  </div>
</body>
</html>
